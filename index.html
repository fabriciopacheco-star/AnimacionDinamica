<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Menú Principal - Animación Dinámica</title>

   <style>
    body {
       background-color: LavenderBlush;
       text-align: center;
       padding-top: 60px;
       font-family: verdana, sans-serif;
    }
    h1 {
       font-family: serif;
       color: RebeccaPurple;
       font-size: 45px;
       margin-bottom: 10px;
    }
    p {
       font-size: 18px;
       color: #555;
       margin-bottom: 30px;
    }
    .menu-container {
       max-width: 400px;
       margin: 0 auto;
       background: white;
       padding: 30px;
       border-radius: 15px;
       box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    ul {
       list-style-type: none;
       padding: 0;
       margin: 0;
    }
    li {
       margin: 15px 0;
    }
    a {
       display: block;
       background-color: RebeccaPurple;
       color: white;
       padding: 14px 20px;
       text-decoration: none;
       border-radius: 8px;
       font-weight: bold;
       font-size: 16px;
       transition: background 0.3s;

    a:hover {
       background-color: #552a6f;
    }
    /* Estilo especial para el botón de Discord */
